# Builds my personal version of the Core Devices Pebble app
# (coredevices/mobileapp, GPL-3.0): the newest upstream release tag with
# every patches/*.patch applied in order, then overlay/ copied over it
# (whole files that replace upstream ones). sherpa-onnx (on-device speech
# recognition) comes from its release AAR.
#
# This repository holds only the patches and this workflow, so syncing with
# upstream never conflicts here. A failed `git apply` means upstream changed
# the lines a patch touches: refresh that patch.
#
# The APK has a token built in, so it is never published where anyone can
# download it: it goes to my relay on tc (token required; tc keeps only the
# newest build, the app's update check finds it there). Only a PRIVATE
# repository also gets a GitHub release. The repository itself holds no
# secrets and may be public.
#
# Runs on push to main, by hand (Actions > Build APK > Run workflow,
# optional upstream tag), and daily: the daily run only builds when the relay
# doesn't have the newest upstream release yet.
#
# Secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_B64      base64 of the signing keystore (alias androiddebugkey,
#                     passwords "android"); keep it: updates need the same key
#   RELAY_URL         https://<relay>/claw  (dictation at /stt, updates at /app)
#   STT_TOKEN         relay token of the "stt" endpoint (built into the app)
#   APP_UPLOAD_TOKEN  APP_UPLOAD_TOKEN of the relay, for uploading builds
# (the first version's names CLAW_KEYSTORE_B64 / CLAW_STT_URL / CLAW_STT_TOKEN /
# CLAW_APP_UPLOAD_TOKEN work too)
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream release tag (empty = newest)"
        required: false
      publish:
        description: "Publish after automated checks (push builds keep an encrypted artifact for emulator acceptance)"
        type: boolean
        default: false
  schedule:
    - cron: "17 20 * * *"   # 04:17 Beijing time

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Check secrets
        env:
          KS: ${{ secrets.KEYSTORE_B64 || secrets.CLAW_KEYSTORE_B64 }}
          RELAY: ${{ secrets.RELAY_URL || secrets.CLAW_STT_URL }}
          TOKEN: ${{ secrets.STT_TOKEN || secrets.CLAW_STT_TOKEN }}
        run: |
          RELAY="${RELAY%/}"; RELAY="${RELAY%/stt}"
          echo "::add-mask::$RELAY"
          echo "RELAY=$RELAY" >> "$GITHUB_ENV"
          missing=""
          [ -n "$KS" ] || missing="$missing KEYSTORE_B64"
          [ -n "$RELAY" ] || missing="$missing RELAY_URL"
          [ -n "$TOKEN" ] || missing="$missing STT_TOKEN"
          [ -z "$missing" ] || { echo "::error::missing secrets:$missing"; exit 1; }

      - name: Pick upstream release
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          TOKEN: ${{ secrets.STT_TOKEN || secrets.CLAW_STT_TOKEN }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --tags --refs https://github.com/coredevices/mobileapp.git |
                  sed 's#.*refs/tags/##' | grep -E '^[0-9]+(\.[0-9]+){1,3}$' | sort -V | tail -n1)
          fi
          [ -n "$tag" ] || { echo "no upstream tag found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream release: $tag"
          if [ "${{ github.event_name }}" = schedule ]; then
            have=$(curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "${RELAY%/}/app/latest" |
                   python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [ "$have" = "$tag" ]; then
              echo "$tag is already on the relay"
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout upstream ${{ steps.pick.outputs.tag }} + patches
        if: steps.pick.outputs.skip != '1'
        run: |
          git clone --filter=blob:none --branch "${{ steps.pick.outputs.tag }}" https://github.com/coredevices/mobileapp.git app
          cd app
          git submodule update --init --recursive
          for p in ../mod/patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --3way --whitespace=nowarn "$p"
          done
          if [ -d ../mod/overlay ]; then
            cp -rv ../mod/overlay/. .
            # newer upstream versions declare releaseUnusedModels; older ones don't
            stt=util/src/androidMain/kotlin/coredevices/util/transcription/PlatformSpeechRecognizer.android.kt
            if [ -f "$stt" ] && ! grep -q "fun releaseUnusedModels" util/src/commonMain/kotlin/coredevices/util/transcription/PlatformSpeechRecognizer.kt; then
              sed -i '/BEGIN releaseUnusedModels/,/END releaseUnusedModels/d' "$stt"
            fi
          fi
          python3 -m pip install -r ../mod/requirements-localization.txt -r ../mod/requirements-transfer.txt
          python3 ../mod/tools/localize.py . --catalog ../mod/localization/catalog.json
          # 64-bit ARM only (every current phone): about half the native code,
          # so half the upload to tc
          sed -i 's/abiFilters += setOf("armeabi-v7a", "arm64-v8a")/abiFilters += setOf("arm64-v8a")/' androidApp/build.gradle.kts
          grep -n 'abiFilters' androidApp/build.gradle.kts
          # sherpa-onnx: classes for util, arm64 native libraries for the app
          SHERPA=1.12.20
          curl -fsSL --retry 3 -o /tmp/sherpa.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA/sherpa-onnx-$SHERPA.aar"
          mkdir -p /tmp/sherpa util/libs androidApp/src/main/jniLibs/arm64-v8a
          unzip -q -o /tmp/sherpa.aar -d /tmp/sherpa
          cp /tmp/sherpa/classes.jar util/libs/sherpa-onnx.jar
          cp /tmp/sherpa/jni/arm64-v8a/*.so androidApp/src/main/jniLibs/arm64-v8a/
          printf '\n# personal build: sherpa-onnx (its JNI code looks classes and fields up by name)\n-keep class com.k2fsa.sherpa.onnx.** { *; }\n' >> androidApp/proguard-rules.pro
          ls -la androidApp/src/main/jniLibs/arm64-v8a
          git --no-pager diff HEAD --stat

      - name: Setup JDK
        if: steps.pick.outputs.skip != '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify localization catalog and source rewriting
        if: steps.pick.outputs.skip != '1'
        run: python3 -m unittest discover -s mod/tests -v

      - name: Save new strings for translation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-report
          path: app/localization-new-strings.json
          if-no-files-found: ignore

      - name: Cache Gradle
        if: steps.pick.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/gradle/**', 'app/*.gradle*', 'app/gradle.properties') }}
          restore-keys: gradle-

      - name: Test continuous dictation and voice compatibility
        if: steps.pick.outputs.skip != '1'
        working-directory: app
        run: |
          ./gradlew --no-configuration-cache :libpebble3:testAndroidHostTest --tests '*ContinuousVoiceTest*'
          ./gradlew --no-configuration-cache :util:testAndroidHostTest --tests '*ContinuousDictationTest*'

      - name: Build release APK
        if: steps.pick.outputs.skip != '1'
        working-directory: app
        env:
          KS: ${{ secrets.KEYSTORE_B64 || secrets.CLAW_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_kirinkiToken: ${{ secrets.STT_TOKEN || secrets.CLAW_STT_TOKEN }}
          ORG_GRADLE_PROJECT_modBuild: ${{ github.run_number }}
        run: |
          export ORG_GRADLE_PROJECT_kirinkiUrl="${RELAY%/}/stt"
          export ORG_GRADLE_PROJECT_modUpdateUrl="${RELAY%/}/app"
          # local release build: signed with the "debug" config (our key in its
          # place) and no Crashlytics mapping upload (the Firebase config is a dummy)
          mkdir -p ~/.android
          printf '%s' "$KS" | base64 -d > ~/.android/debug.keystore
          echo "LOCAL_RELEASE_BUILD=true" >> local.properties
          mv androidApp/src/google-services-dummy.json androidApp/src/google-services.json
          ./gradlew --no-configuration-cache :androidApp:assembleRelease
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "../pebble-mod-${{ steps.pick.outputs.tag }}.apk"
          ls -la ../pebble-mod-*.apk

      - name: Encrypt private recovery artifact
        if: steps.pick.outputs.skip != '1'
        run: |
          python3 mod/tools/private-build.py encrypt "pebble-mod-${{ steps.pick.outputs.tag }}.apk"             mod/tools/apk-transfer-public.pem private-artifact "${{ github.run_number }}" "${{ steps.pick.outputs.tag }}"

      - name: Save encrypted APK for private transfer
        if: steps.pick.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: private-apk-${{ github.run_number }}
          path: private-artifact/
          retention-days: 1
          if-no-files-found: error

      - name: Upload to the relay (app updates)
        if: steps.pick.outputs.skip != '1' && (github.event_name == 'schedule' || inputs.publish == true)
        env:
          UP: ${{ secrets.APP_UPLOAD_TOKEN || secrets.CLAW_APP_UPLOAD_TOKEN }}
          READ_TOKEN: ${{ secrets.STT_TOKEN || secrets.CLAW_STT_TOKEN }}
        run: |
          if [ -z "$UP" ]; then
            echo "::warning::APP_UPLOAD_TOKEN is missing; encrypted artifact is available"
            exit 0
          fi
          python3 mod/tools/upload-apk.py "pebble-mod-${{ steps.pick.outputs.tag }}.apk" \
            "${RELAY%/}/app/upload" "${{ steps.pick.outputs.tag }}" "${{ github.run_number }}"

      - name: GitHub release (private repository only)
        if: steps.pick.outputs.skip != '1' && (github.event_name == 'schedule' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)" != PRIVATE ]; then
            echo "public repository: no GitHub release (the APK carries a token); it is on the relay"
            exit 0
          fi
          tag="mod-${{ steps.pick.outputs.tag }}"
          apk="pebble-mod-${{ steps.pick.outputs.tag }}.apk"
          notes="Core Devices Pebble app ${{ steps.pick.outputs.tag }} + patches/. Build ${{ github.run_number }} from ${{ github.sha }}."
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --title "$tag" --notes "$notes"
          fi
